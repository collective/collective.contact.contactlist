[settings]
requirements-in = requirements.txt
main-package = -e .[test]
; setuptools 82+ has no pkg_resources, still used at import time by released add-ons
version-overrides =
    setuptools==81.0.0
    collective.contact.widget @ git+https://github.com/collective/collective.contact.widget.git@python3-chris-adam

[collective.contact.core]
url = https://github.com/collective/collective.contact.core.git
branch = python3-chris-adam

[collective.contact.facetednav]
url = https://github.com/collective/collective.contact.facetednav.git
branch = plone6-chris-adam

[collective.fingerpointing]
url = https://github.com/collective/collective.fingerpointing.git
branch = master

[collective.js.tooltipster]
url = https://github.com/collective/collective.js.tooltipster.git
branch = plone61-chris-adam

[eea.facetednavigation]
url = https://github.com/chris-adam/eea.facetednavigation.git
branch = develop-chris-adam

[imio.helpers]
url = https://github.com/imio/imio.helpers.git
branch = py3-email-address-headers

[plone.formwidget.masterselect]
url = https://github.com/collective/plone.formwidget.masterselect.git
branch = master
